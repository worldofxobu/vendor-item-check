name: Refresh Forever vendor data

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forever-vendor-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Lua 5.1 test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Refresh and summarize source changes
        shell: bash
        run: |
          python3 scripts/build_data.py --refresh | tee /tmp/vic-refresh.log
          python3 scripts/update_data_docs.py
      - name: Validate generated data and both clients
        run: |
          python3 tests/run_tests.py
          lua5.1 tests/smoke.lua
          lua5.1 tests/classic_smoke.lua
          lua5.1 tests/forever_smoke.lua
          lua5.1 tests/merchant_smoke.lua
          lua5.1 tests/export_smoke.lua
          lua5.1 tests/controller_smoke.lua
          python3 scripts/update_data_docs.py --check
          git diff --check
      - name: Prepare review description
        run: |
          python3 - <<'PY'
          from pathlib import Path
          summary = Path('/tmp/vic-refresh.log').read_text()
          Path('/tmp/vic-update-pr.md').write_text(
              'Refresh the bundled Forever vendor observations and their coverage documentation.\n\n'
              '```text\n' + summary + '```\n\n'
              'Sources: [Everloot public observations](https://everloot.app/docs/api) and maintainer-reviewed VIC contributions, CC BY-SA 4.0. '
              'Only corroborated live observations qualify; Classic data is unchanged. '
              'Bundled quote evidence is not a personal purchase price; character-specific quotes are collected separately in game.\n\n'
              'Validation: Python test runner (including importer and documentation checks), '
              'Lua 5.1 modern, Classic and Forever smoke tests, and whitespace checks passed. '
              'In-game checks have not been performed by this workflow.\n\n'
              'Review inventory removals, changed price evidence, observation dates and source confidence before merging. '
              'This PR does not publish a release.\n'
          )
          PY
      - name: Open or update the data review PR
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: automation/forever-vendor-data
          base: ${{ github.event.repository.default_branch }}
          title: 'data: refresh confirmed Forever vendor observations'
          commit-message: 'data: refresh confirmed Forever vendor observations'
          body-path: /tmp/vic-update-pr.md
          add-paths: |
            VendorItemCheck/DataForever.lua
            scripts/data/forever-source.json
            README.md
            CHANGELOG.md
